<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!--
  Config do libfontconfig embutido no OpenWhispr, carregada via
  FONTCONFIG_FILE pela entrada de autostart deste pacote. Mesmas fontes e
  regras do sistema, com cache próprio em $XDG_CACHE_HOME: o libfontconfig
  do app não aceita os caches que o do sistema, mais novo, escreve.
-->
<fontconfig>
  <dir>/usr/share/fonts</dir>
  <dir>/usr/local/share/fonts</dir>
  <dir prefix="xdg">fonts</dir>
  <include ignore_missing="yes">/etc/fonts/conf.d</include>
  <cachedir prefix="xdg">open-whispr-fontconfig</cachedir>
</fontconfig>
